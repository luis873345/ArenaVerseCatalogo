
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArenaVerse | Administración</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:#eef5ff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:100%;max-width:420px;background:#111b2d;border:1px solid #245b91;border-radius:18px;padding:28px;box-shadow:0 0 35px #0879bd22}
h1{text-align:center;color:#62d8ff;letter-spacing:3px}
p{text-align:center;color:#a8bad2}
label{display:block;margin:18px 0 7px}
input,select{width:100%;padding:13px;background:#091322;border:1px solid #35516f;border-radius:8px;color:white;font-size:16px}
button{width:100%;padding:13px;margin-top:20px;background:#087fc1;border:0;border-radius:8px;color:white;font-weight:bold;font-size:16px}
.note{font-size:12px;line-height:1.5}
#admin{display:none}
</style>
</head>
<body>
<main>
  <h1>ARENAVERSE</h1>
  <p>Panel de administración</p>

  <section id="login">
    <h2>Iniciar sesión</h2>
    <label for="email">Correo administrador</label>
    <input id="email" type="email"
      value="andrescontreras67786@gmail.com" autocomplete="username">

    <label for="password">Contraseña</label>
    <input id="password" type="password"
      placeholder="Introduce tu contraseña"
      autocomplete="current-password">

    <button id="loginButton" type="button">Entrar</button>
    <p id="message" class="note">
      El acceso seguro debe configurarse antes de publicar la página.
    </p>
  </section>

  <section id="admin">
    <h2>Administrar catálogo</h2>
    <p>Vista inicial del administrador</p>
    <label for="name">Nombre del artículo</label>
    <input id="name" placeholder="Nombre del artículo">
    <label for="category">Categoría</label>
    <select id="category">
      <option>Ropa</option>
      <option>Armas</option>
      <option>Paquetes</option>
      <option>Accesorios</option>
      <option>Objetos</option>
    </select>
    <label for="price">Precio</label>
    <input id="price" type="number" min="0" placeholder="Precio">
    <label for="currency">Moneda</label>
    <select id="currency">
      <option>Monedas</option>
      <option>Diamantes</option>
    </select>
    <label for="image">Imagen del artículo</label>
    <input id="image" type="file" accept="image/*">
    <p class="note">Esta es una maqueta. Todavía no publica artículos en Unity.</p>
  </section>
</main>
<script>
document.getElementById("loginButton").addEventListener("click", function () {
  document.getElementById("message").textContent =
    "Falta conectar la autenticación segura. No introduzcas una contraseña real todavía.";
});
</script>
</body>
</html>
